[project]
name = "arena"
version = "0.1.0"
description = "Structural model, validation harness and day-of pipeline for the HRT Algo Arena news-driven return challenge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # data + numerics
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    # plotting
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # notebooks (ipywidgets is needed for tqdm.notebook progress bars used by HRT's sessions.py)
    "jupyterlab>=4.1",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "nbstripout>=0.7",
    # libraries HRT's starter code (sessions.py) imports
    "attrs>=23.2",
    "rich>=13.7",
    "tqdm>=4.66",
    # data download (HRT shares data through a Google Drive folder) + tuning
    "gdown>=5.1",
    "optuna>=3.6",
]

[project.optional-dependencies]
# Heavy: only install if you plan to run FinBERT on real (Bloomberg-style) headlines.
nlp = [
    "torch>=2.2",
    "transformers>=4.40",
]
# Gradient boosting. On macOS LightGBM needs `brew install libomp`.
boost = [
    "lightgbm>=4.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=arena --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "members", "signals", "submissions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/*.ipynb" = ["E402", "E702", "F401", "F811"]
